<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host chat logs · Sage & Astra</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="host-logs.js" defer></script><style>.host-card{max-width:650px;margin:40px auto;padding:28px;background:#fffdf5;border:1px solid #c8d5bd;border-radius:16px}.host-card h1{font-size:32px;margin-bottom:12px}.host-card p{font-size:13px;color:#63756d;line-height:1.7}.host-card label{display:block;font-size:12px;font-weight:700;margin:20px 0 8px}.host-card input{width:100%;padding:12px;border:1px solid #c8d5bd;border-radius:8px;color:#243f3b;background:#fff}.host-card button{margin-top:23px}#export-status{margin-top:17px;overflow-wrap:anywhere}</style></head><body><main class="shell"><section class="host-card"><h1>Chat logs</h1><p>Download transcripts saved by remote testers. Leave the name blank to export everyone.</p><form id="log-export"><label for="host-key">Private host key</label><input id="host-key" type="password" autocomplete="off" required><label for="log-speaker">Tester name (optional)</label><input id="log-speaker" type="text" maxlength="40"><button id="export-logs" type="submit" class="record-button">Download JSON ↓</button></form><p id="export-status" role="status">Your host key is used only for this export and is not saved in the browser.</p></section></main></body></html>
